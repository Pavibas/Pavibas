name: myworkflow

on:
  push:
    branches: ["main"]
  pull request:
    branches: ["main"]
jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: Setup-python@v5
      with: 
        python-version: "3.10"
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest safetly flake8
    - name: Lint check (code quality)
      run: |
        flake8

    - name: Securtiy check
      run: |
        safety check

    - name: Run tests
      run: |
        pytest
